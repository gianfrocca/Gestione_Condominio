version: '3.8'

services:
  # Database PostgreSQL
  postgres:
    image: postgres:17-alpine
    container_name: condominio-postgres
    environment:
      POSTGRES_DB: condominio_db
      POSTGRES_USER: condominio_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-defaultpassword123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U condominio_user -d condominio_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - condominio-network

  # Applicazione Node.js
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: condominio-app
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: condominio_db
      DB_USER: condominio_user
      DB_PASSWORD: ${DB_PASSWORD:-defaultpassword123}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - condominio-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  condominio-network:
    driver: bridge
