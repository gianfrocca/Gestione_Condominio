version: '3.8'

services:
  # Applicazione Node.js con Frontend + Backend
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gestione-condominio-app
    environment:
      NODE_ENV: production
      PORT: 3000
      STORAGE_TYPE: ${STORAGE_TYPE:-file}
      # Lascia questi se usi PostgreSQL (STORAGE_TYPE=postgresql)
      DB_HOST: ${DB_HOST:-localhost}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-condominio_db}
      DB_USER: ${DB_USER:-condominio_user}
      DB_PASSWORD: ${DB_PASSWORD:-secure_password_123}
      DB_SSL: ${DB_SSL:-false}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-random-value-in-production}
    ports:
      - "3000:3000"
    volumes:
      - condominio-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL (opzionale, solo se STORAGE_TYPE=postgresql)
  postgres:
    image: postgres:17-alpine
    container_name: condominio-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-condominio_db}
      POSTGRES_USER: ${DB_USER:-condominio_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-condominio_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - postgres

volumes:
  condominio-data:
    driver: local
  postgres_data:
    driver: local

